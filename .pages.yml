media:
  input: public/images
  output: /images
content:
  - name: settings
    label: Settings
    type: file
    file: src/content/settings.json
    fields:
      - name: siteName
        label: Site Name
        type: string
  - name: posts
    label: Posts
    type: collection
    folder: src/content/posts
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Body
        type: rich-text
