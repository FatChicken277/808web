media:
  input: public/images
  output: /images
content:
  - name: settings
    label: Settings
    type: file
    path: src/content/settings.json
    fields:
      - name: siteName
        label: Site Name
        type: string
      - name: heroVideo
        label: Hero Video (o Imagen)
        type: file
      - name: sectionVideo
        label: Video de la Sección (o Imagen)
        type: file
  - name: artists
    label: Artists
    type: collection
    path: src/content/artists
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: instagram
        label: Instagram
        type: string
      - name: image
        label: Image
        type: image
  - name: caos
    label: Seccion Caos (Mini Posts)
    type: collection
    path: src/content/caos
    fields:
      - name: title
        label: Titulo
        type: string
        required: true
      - name: description
        label: Descripcion
        type: string
      - name: image
        label: Imagen
        type: image
      - name: width
        label: Columnas (1 = Toda la fila, 2 = Mitad de la fila)
        type: select
        options:
          values:
            - "1"
            - "2"
      - name: direction
        label: Direccion (Horizontal o Vertical)
        type: select
        options:
          values:
            - "vertical"
            - "horizontal"
      - name: distribution
        label: Distribución (Imagen / Texto)
        type: select
        options:
          values:
            - "50/50"
            - "60/40"
            - "40/60"
            - "80/20"
            - "20/80"
  - name: team
    label: Equipo Organizador
    type: collection
    path: src/content/team
    fields:
      - name: name
        label: Nombre Completo
        type: string
      - name: role
        label: Rol en el Evento
        type: string
      - name: instagram
        label: Usuario de Instagram (sin el @)
        type: string
      - name: image
        label: Imagen de Perfil
        type: image
